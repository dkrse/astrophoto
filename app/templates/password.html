{% extends "base.html" %}
{% block content %}
<form method="post" class="card narrow">
  <h1>Change password</h1>
  <label>Current password<input name="old" type="password" required></label>
  <label>New password<input name="new" type="password" required></label>
  <label>Repeat new password<input name="new2" type="password" required></label>
  <button class="btn primary">Change</button>
</form>
{% endblock %}
